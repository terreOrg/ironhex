name: Ironhex Browser E2E

on:
  push:
    branches: [main, 'audit/agoac-*', 'feat/agoac-ch12-*', 'feat/megamek-*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ironhex-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chromium / WebGL / UI
    runs-on: [self-hosted, Linux, X64, spellfire]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Plan coverage reuse from verified merge parent
        if: github.ref == 'refs/heads/main'
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/coverage-plan.mjs
      - name: Restore verified browser coverage
        id: restore_browser
        if: steps.plan.outputs.reuse_browser != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ironhex-browser-lcov-${{ steps.plan.outputs.parent_sha }}
          run-id: ${{ steps.plan.outputs.reuse_browser }}
          github-token: ${{ github.token }}
          path: coverage
      - name: Validate restored browser report
        if: github.ref == 'refs/heads/main'
        id: valid_browser
        shell: bash
        run: |
          if [ "${{ steps.restore_browser.outcome }}" = success ] && [ -s coverage/browser.info ]; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            rm -f coverage/browser.info
          fi
      - name: Confirm sources are synchronized
        if: github.ref != 'refs/heads/main' || steps.valid_browser.outputs.reuse != 'true'
        run: node scripts/build-web.mjs --check
      - name: Install pinned browser-test and coverage tools
        if: github.ref != 'refs/heads/main' || steps.valid_browser.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/audit/agoac-ch11-* ]]; then
            npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1 v8-to-istanbul@9.3.0 istanbul-lib-coverage@3.2.2 istanbul-lib-report@3.0.1 istanbul-reports@3.1.7
          else
            npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          fi
      - name: Install headless Chromium
        if: github.ref != 'refs/heads/main' || steps.valid_browser.outputs.reuse != 'true'
        run: npx --no-install playwright install chromium
      # Chapter-11 audit branches get focused scenario regressions first;
      # main and other audit branches retain all browser cases and full LCOV.
      # The engine/API job always runs its full unit coverage separately.
      - name: Execute Chapter 11 Chromium scenario regressions
        if: startsWith(github.ref, 'refs/heads/audit/agoac-ch11-')
        run: |
          node --test --test-name-pattern='^(AGoAC Ch11|AGoAC Chapter 11|AGoAC 3D room)' tests/browser.mjs
      - name: Execute full browser test suite and verify coverage report
        if: ${{ !startsWith(github.ref, 'refs/heads/audit/agoac-ch11-') && (github.ref != 'refs/heads/main' || steps.valid_browser.outputs.reuse != 'true') }}
        env:
          IRONHEX_BROWSER_COVERAGE: '1'
        run: |
          rm -f coverage/browser.info
          node --test tests/browser.mjs
          test -s coverage/browser.info
      - name: True three-seat Chromium and PostgreSQL integration (Chapter 11)
        if: startsWith(github.ref, 'refs/heads/audit/agoac-ch11-')
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="ironhex-api-agoac-ch11-e2e:${GITHUB_SHA:0:12}-${suffix}"
          db="ironhex-pg-ch11-e2e-${suffix}"
          api="ironhex-api-ch11-e2e-${suffix}"
          cleanup() {
            docker rm -fv "$api" "$db" >/dev/null 2>&1 || true
            docker image rm -f "$image" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # Isolated temporary PostgreSQL database; no host data, volumes,
          # reverse proxy, Docker prune or production services are touched.
          docker build -f apps/api/Dockerfile -t "$image" .
          docker run -d --rm --name "$db" \
            -p 127.0.0.1::3000 \
            --mount type=tmpfs,destination=/var/lib/postgresql/data,tmpfs-size=536870912 \
            -e POSTGRES_USER=ironhex -e POSTGRES_DB=ironhex \
            -e POSTGRES_PASSWORD=ci-ephemeral-not-secret postgres:17-alpine
          for i in $(seq 1 60); do
            if docker exec "$db" sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT 1"' 2>/dev/null | grep -qx 1; then break; fi
            sleep 1
          done
          # Only the local browser endpoint is exposed by this test.
          browser_port=$((21000 + GITHUB_RUN_ID % 10000))
          docker run -d --rm --name "$api" --network "container:$db" \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 \
            -e PGUSER=ironhex -e PGDATABASE=ironhex \
            -e PGPASSWORD=ci-ephemeral-not-secret \
            -e IRONHEX_PUBLIC_ORIGIN="http://127.0.0.1:$browser_port" \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges "$image"
          port_binding="$(docker port "$db" 3000/tcp)"
          api_port="${port_binding##*:}"
          for i in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:$api_port/api/health" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:$api_port/api/health" >/dev/null
          IRONHEX_REAL_API_PORT="$api_port" IRONHEX_REAL_BROWSER_PORT="$browser_port" \
            node tests/scenario-three-browser-postgres.mjs
      - name: Upload browser LCOV report
        if: ${{ !startsWith(github.ref, 'refs/heads/audit/agoac-ch11-') }}
        uses: actions/upload-artifact@v4
        with:
          name: ironhex-browser-lcov-${{ github.sha }}
          path: coverage/browser.info
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ironhex-browser-failure-${{ github.run_id }}
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
