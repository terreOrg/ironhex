name: Ironhex Browser E2E

on:
  push:
    branches: [main, 'audit/agoac-*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ironhex-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Chromium / WebGL / UI
    runs-on: [self-hosted, Linux, X64, spellfire]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Plan coverage reuse from verified merge parent
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/coverage-plan.mjs
      - name: Restore verified browser coverage
        id: restore_browser
        if: steps.plan.outputs.reuse_browser != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ironhex-browser-lcov-${{ steps.plan.outputs.parent_sha }}
          run-id: ${{ steps.plan.outputs.reuse_browser }}
          github-token: ${{ github.token }}
          path: coverage
      - name: Validate restored browser report
        id: valid_browser
        shell: bash
        run: |
          if [ "${{ steps.restore_browser.outcome }}" = success ] && [ -s coverage/browser.info ]; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            rm -f coverage/browser.info
          fi
      - name: Confirm sources are synchronized
        if: steps.valid_browser.outputs.reuse != 'true'
        run: node scripts/build-web.mjs --check
      - name: Install pinned browser-test and coverage tools
        if: steps.valid_browser.outputs.reuse != 'true'
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1 v8-to-istanbul@9.3.0 istanbul-lib-coverage@3.2.2 istanbul-lib-report@3.0.1 istanbul-reports@3.1.7
      - name: Install headless Chromium
        if: steps.valid_browser.outputs.reuse != 'true'
        run: npx --no-install playwright install chromium
      - name: Execute browser test suite and verify coverage report
        if: steps.valid_browser.outputs.reuse != 'true'
        env:
          IRONHEX_BROWSER_COVERAGE: '1'
        run: |
          rm -f coverage/browser.info
          node --test tests/browser.mjs
          test -s coverage/browser.info
      - name: Upload browser LCOV report
        uses: actions/upload-artifact@v4
        with:
          name: ironhex-browser-lcov-${{ github.sha }}
          path: coverage/browser.info
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ironhex-browser-failure-${{ github.run_id }}
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
