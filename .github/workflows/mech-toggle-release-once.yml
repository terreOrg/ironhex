name: IRON HEX Mech Toggle release request

# One release only: explicitly requested by the owner for PR #197.
# The normal manual deployment workflow and its quality gate are unchanged.
on:
  workflow_run:
    workflows: ["Ironhex CI", "Ironhex Browser E2E", "Ironhex Container Smoke", "Ironhex SonarQube"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: ironhex-toggle-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Deploy mech-toggle (#197)')
    runs-on: [self-hosted, Linux, X64, spellfire]
    timeout-minutes: 3
    steps:
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dispatch only the existing verified-release workflows
        env:
          TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node --input-type=module <<'NODE'
          const {TOKEN, RELEASE_SHA:sha, GITHUB_REPOSITORY:repo}=process.env;
          if(!/^[a-f0-9]{40}$/.test(sha))throw Error('Invalid release SHA');
          const api=async(path,method='GET',body)=>{
            const r=await fetch('https://api.github.com/repos/'+repo+path,{
              method,headers:{Authorization:'Bearer '+TOKEN,Accept:'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
              ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(15000)
            });
            if(!r.ok)throw Error('GitHub API '+r.status+' '+path);
            return r.status===204?null:r.json();
          };
          const main=async()=>(await api('/git/ref/heads/main')).object.sha;
          if(await main()!==sha){console.log('Release is no longer main HEAD');process.exit(0);}
          const commit=await api('/git/commits/'+sha);
          if(!commit.message.startsWith('Deploy mech-toggle (#197)')){console.log('No explicit release request');process.exit(0);}
          const runs=(await api('/actions/runs?head_sha='+sha+'&per_page=100')).workflow_runs.filter(r=>r.head_sha===sha&&r.head_branch==='main');
          const passed=(name,event)=>{
            const relevant=runs.filter(r=>r.name===name&&r.event===event);
            return relevant.some(r=>r.status==='completed'&&r.conclusion==='success')&&
              relevant.every(r=>r.status==='completed'&&['success','cancelled'].includes(r.conclusion));
          };
          if(!['Ironhex CI','Ironhex Browser E2E','Ironhex SonarQube','Ironhex Container Smoke'].every(name=>passed(name,'push'))){
            console.log('Waiting for exact main push checks; no dispatch');process.exit(0);
          }
          const smoke=runs.filter(r=>r.name==='Ironhex Container Smoke'&&r.event==='workflow_dispatch');
          if(!smoke.length){
            if(await main()!==sha)process.exit(0);
            await api('/actions/workflows/container-smoke.yml/dispatches','POST',{ref:'main'});
            console.log('Requested mandatory full manual smoke for '+sha);process.exit(0);
          }
          if(!passed('Ironhex Container Smoke','workflow_dispatch')){console.log('Full manual smoke is not successful');process.exit(0);}
          if(runs.some(r=>r.name==='Ironhex Deploy'&&r.event==='workflow_dispatch')){console.log('Deployment already requested');process.exit(0);}
          if(await main()!==sha)process.exit(0);
          await api('/actions/workflows/deploy.yml/dispatches','POST',{ref:'main'});
          console.log('Submitted explicit deployment request for '+sha+'; deploy.yml independently enforces its original gate.');
          NODE
