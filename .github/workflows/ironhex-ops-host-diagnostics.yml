name: IRONHEX deploy host diagnostics fe1b539
on:
  push:
    branches:
      - ops/diagnose-ironhex-deploy-fe1b539-20261123

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only deployment diagnostic from local runner
    runs-on: [self-hosted, Linux, X64, spellfire]
    timeout-minutes: 3
    steps:
      - name: Inspect local containers and HTTP health
        shell: bash
        run: |
          echo "Host time UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Komodo webhook accepted at 2026-11-23T06:29:31Z"
          for name in ironhex-web ironhex-api ironhex-db; do
            if docker inspect "$name" >/dev/null 2>&1; then
              docker inspect -f 'Container {{.Name}} status={{.State.Status}} started={{.State.StartedAt}} image={{.Image}}' "$name"
              docker inspect -f 'Health={{if .State.Health}}{{.State.Health.Status}}{{else}}not-defined{{end}}' "$name"
            else
              echo "MISSING: $name"
            fi
          done
          echo 'Frontend port 18088 /health:'
          curl -sS -o /dev/null -w 'http=%{http_code} seconds=%{time_total}\n' --connect-timeout 2 --max-time 5 http://127.0.0.1:18088/health || true

          echo 'Komodo CLI check:'
          if command -v km >/dev/null 2>&1; then command -v km; km --version || true; else echo 'km not in runner PATH'; fi
          echo 'Compose projects and service provenance:'
          docker compose ls --format json || true
          for name in ironhex-web ironhex-api ironhex-db; do
            docker inspect -f 'Compose {{.Name}} project={{index .Config.Labels "com.docker.compose.project"}} service={{index .Config.Labels "com.docker.compose.service"}} working_dir={{index .Config.Labels "com.docker.compose.project.working_dir"}} config_files={{index .Config.Labels "com.docker.compose.project.config_files"}}' "$name" 2>/dev/null || true
          done

          echo 'Read-only bt stack build metadata:'
          for loc in /etc/komodo/stacks/bt /etc/komodo/stacks/ironhex; do
            if [ -d "$loc" ]; then
              echo "Stack directory exists: $loc"
              if [ -d "$loc/.git" ]; then git -C "$loc" rev-parse HEAD || true; else echo 'No .git in stack directory'; fi
              if [ -f "$loc/compose.yaml" ]; then
                (cd "$loc" && docker compose -f compose.yaml config --format json 2>/dev/null) |
                  python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({k:{"image":v.get("image"),"build":v.get("build"),"pull_policy":v.get("pull_policy"),"volumes":[x.get("source") for x in v.get("volumes",[]) if isinstance(x,dict)]} for k,v in d.get("services",{}).items() if k.startswith("ironhex-")}))' || true
              fi
              echo 'Stack filenames (not contents):'
              find "$loc" -maxdepth 1 -type f -printf '%f\n' | head -25
            else
              echo "Not a directory: $loc"
            fi
          done

          echo 'Stack ownership and git revision (safe read-only):'
          stat -c 'path=%n owner=%U group=%G mode=%a' /etc/komodo/stacks/bt /etc/komodo/stacks/bt/compose.yaml /etc/komodo/stacks/bt/.env || true
          git -c safe.directory=/etc/komodo/stacks/bt -C /etc/komodo/stacks/bt rev-parse HEAD || true
          git -c safe.directory=/etc/komodo/stacks/bt -C /etc/komodo/stacks/bt branch --show-current || true
          echo 'Does Compose config parse:'
          if (cd /etc/komodo/stacks/bt && docker compose -f compose.yaml config --quiet >/dev/null 2>&1); then echo COMPOSE_CONFIG_VALID; else echo COMPOSE_CONFIG_INVALID_OR_UNREADABLE; fi
          echo 'Read selected YAML build and image keys without environment values:'
          python3 - <<'PY'
          import pathlib,re
          src=pathlib.Path('/etc/komodo/stacks/bt/compose.yaml')
          try:
              data=src.read_text().splitlines()
              for index,line in enumerate(data):
                  if re.match(r'^  ironhex-(web|api|db):',line): print(line)
                  if re.match(r'^    (image|pull_policy|build|context|dockerfile):',line): print(line)
          except Exception as e: print(type(e).__name__)
          PY
          echo 'Komodo containers:'
          docker ps --format '{{.Names}}' | grep -i komodo || true
          echo 'API port 18089 /api/health:'
          curl -sS -o /dev/null -w 'http=%{http_code} seconds=%{time_total}\n' --connect-timeout 2 --max-time 5 http://127.0.0.1:18089/api/health || true
