name: Ironhex Deploy

# Manual deployment only during the AGoAC audit.
# The existing four-workflow Quality Gate remains mandatory on main.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ironhex-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Gate checks and trigger local Komodo
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, spellfire]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all CI results and trigger private Komodo webhook
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: node scripts/deploy-after-ci.mjs
