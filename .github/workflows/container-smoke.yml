name: Ironhex Container Smoke

on:
  push:
    branches: [main, 'audit/agoac-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ironhex-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Frontend and backend Docker smoke
    runs-on: [self-hosted, Linux, X64, spellfire]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select smoke scope (manual runs always full)
        id: plan
        run: node scripts/smoke-plan.mjs
      - name: Verify Compose with CI-only placeholder secret
        if: steps.plan.outputs.skip_smoke != 'true'
        env:
          IRONHEX_DB_PASSWORD: ci-validation-only
        run: docker compose -f compose.yaml config --quiet
      - name: Build and smoke-test isolated Nginx image
        if: steps.plan.outputs.skip_smoke != 'true'
        shell: bash
        run: |
          set -euo pipefail
          image_tag="ironhex-web-ci:${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="ironhex-web-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logs "$container" 2>/dev/null || true; docker rm -fv "$container" >/dev/null 2>&1 || true; docker image rm -f "$image_tag" >/dev/null 2>&1 || true' EXIT
          docker build --tag "$image_tag" .
          docker run -d --rm --name "$container" \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            "$image_tag"
          for i in $(seq 1 30); do
            if docker exec "$container" sh -c 'wget -qO- http://127.0.0.1:8080/health | grep -qx OK'; then
              break
            fi
            sleep 1
          done
          docker exec "$container" sh -c 'wget -qO- http://127.0.0.1:8080/health | grep -qx OK'
          docker exec "$container" sh -c 'wget -qO- http://127.0.0.1:8080/index.html | grep -q IRON'
          docker exec "$container" wget -qO /dev/null http://127.0.0.1:8080/app.js
          docker exec "$container" wget -qO /dev/null http://127.0.0.1:8080/atlas-09.glb
          docker exec "$container" wget -qO /dev/null http://127.0.0.1:8080/aether-02.glb

      - name: Build backend and smoke-test PostgreSQL integration
        if: steps.plan.outputs.skip_smoke != 'true'
        shell: bash
        run: |
          set -euo pipefail
          image_tag="ironhex-api-ci:${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          database="ironhex-postgres-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          api="ironhex-api-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker logs "$api" 2>/dev/null || true; docker logs "$database" 2>/dev/null || true; docker rm -fv "$api" "$database" >/dev/null 2>&1 || true; docker image rm -f "$image_tag" >/dev/null 2>&1 || true' EXIT
          docker build -f apps/api/Dockerfile --tag "$image_tag" .
          # Both containers share one isolated network namespace; neither publishes host ports.
          docker run -d --rm --name "$database" \
            --mount type=tmpfs,destination=/var/lib/postgresql/data,tmpfs-size=536870912 \
            -e POSTGRES_USER=ironhex -e POSTGRES_DB=ironhex \
            -e POSTGRES_PASSWORD=ci-only-not-a-real-secret postgres:17-alpine
          # Regression guard: PG17 declares this directory as a Docker VOLUME.
          # The explicit tmpfs must override it; no anonymous volume may be created.
          docker exec "$database" grep -q " /var/lib/postgresql/data tmpfs " /proc/mounts
          volumes=$(docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{println .Name}}{{end}}{{end}}' "$database")
          if [ -n "$volumes" ]; then
            echo "Unexpected persistent PostgreSQL smoke volumes: $volumes" >&2
            exit 1
          fi
          # PostgreSQL's temporary bootstrap server accepts Unix-socket queries,
          # then shuts down. Test the final TCP listener to avoid that race.
          ready=0
          for i in $(seq 1 60); do
            if docker exec "$database" sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atqc "SELECT 1"' 2>/dev/null | grep -qx '1'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs "$database"
            echo "PostgreSQL did not become ready" >&2
            exit 1
          fi
          docker run -d --rm --name "$api" --network "container:$database" \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 \
            -e PGUSER=ironhex -e PGDATABASE=ironhex \
            -e PGPASSWORD=ci-only-not-a-real-secret \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --cap-drop ALL --security-opt no-new-privileges "$image_tag"
          for i in $(seq 1 60); do
            if docker exec "$api" node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$api" node -e "fetch('http://127.0.0.1:3000/api/health').then(async r=>{const body=await r.json();process.exit(r.ok&&body.database==='ok'?0:1)}).catch(()=>process.exit(1))"
          docker exec "$api" node -e "fetch('http://127.0.0.1:3000/api/v1/catalog/chassis').then(async r=>{const body=await r.json();process.exit(r.ok&&body.items?.length===4?0:1)}).catch(()=>process.exit(1))"
          docker exec "$database" psql -U ironhex -d ironhex -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public'" | grep -qx '16'
          docker exec "$database" psql -U ironhex -d ironhex -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='agoac_scenario_rooms'" | grep -qx '1'
          docker exec "$api" node /app/tests/auth-integration.mjs
          docker exec "$api" node /app/tests/auth-email-integration.mjs
          docker exec "$api" node /app/tests/operations-integration.mjs
          docker exec "$api" node /app/tests/market-integration.mjs
          echo "PostgreSQL migrations, auth registration/login, health and catalogue verified."

      - name: Always clean isolated smoke resources
        if: always() && steps.plan.outputs.skip_smoke != 'true'
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker info >/dev/null
          # Only this attempt's resources; never prune host or production volumes.
          for container in "ironhex-api-smoke-$suffix" "ironhex-postgres-smoke-$suffix" "ironhex-web-smoke-$suffix"; do
            if docker container inspect "$container" >/dev/null 2>&1; then
              docker rm -fv "$container"
            fi
          done
          for image in "ironhex-api-ci:${GITHUB_SHA:0:12}-$suffix" "ironhex-web-ci:${GITHUB_SHA:0:12}-$suffix"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm -f "$image"
            fi
          done
          echo "Isolated smoke resources cleaned"
