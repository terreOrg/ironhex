name: Ironhex CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# CI runs one job on one self-hosted runner; a matrix of seven jobs
# caused tests to be stuck in GitHub's queue despite idle capacity.
concurrency:
  group: ironhex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Sources, rules engine, API, authentication and deploy gate
    runs-on: [self-hosted, Linux, X64, spellfire]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate generated browser sources
        run: node scripts/build-web.mjs --check
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/*.js apps/web/src/*.js packages/engine/*.js \
            apps/api/src/*.mjs scripts/*.mjs tests/*.mjs; do
            node --check "$file"
          done
      - name: Run all unit tests
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/combat.mjs tests/construction.mjs \
            tests/fire-arcs.mjs tests/api.mjs tests/economy.mjs tests/components.mjs tests/rulebook.mjs tests/market.mjs tests/auth.mjs \
            tests/deploy-gate.mjs tests/tactical-operations.mjs tests/rules-registry.mjs; do
            echo "::group::Testing $file"
            node --test "$file"
            echo "::endgroup::"
          done
